[project]
name = "jif"
version = "0.1.0"
authors = [
    {name = "nev", email = "sshabalin3+1@gatech.edu"},
]
requires-python = "==3.12.*"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "torch==2.3.1+cpu",
    "penzai>=0.2.5",
    "fire>=0.6.0",
    "more-itertools>=10.3.0",
    "jax[tpu]>=0.4.31",
    "optax>=0.2.3",
    "rich>=13.7.1",
    "tokenizers>=0.20.0",
    "wandb>=0.21.0",
    "datasets>=2.19.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cpu"]
index-strategy = "first-index"

[[tool.uv.index]]
name = "libtpu"
url = "https://storage.googleapis.com/jax-releases/libtpu_releases.html"

[[tool.uv.index]]
name = "jax-nightly"
url = "https://storage.googleapis.com/jax-releases/jax_nightly_releases.html"

[[tool.pdm.source]]
name = "torch"
url = "https://download.pytorch.org/whl/cpu"

[project.optional-dependencies]
vis = [
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.3",
    "matplotlib>=3.9.1",
    "isort>=5.13.2",
    "tensorboard-plugin-profile>=2.17.0",
    "tensorflow>=2.19.0",
    "tensorboard>=2.19.0",
]
